<!--
  Author credit for new pages on vicentegabrielflores.com.
  1. In <head>, keep or add:
       <meta name="author" content="Vicente Gabriel Flores">
       <link rel="stylesheet" href="/assets/author-credit.css">
  2. Keep any existing JSON-LD, signature, and canonical tags.
     Add or complete an author Person on the work's JSON-LD (Poem, Article,
     VisualArtwork, CollectionPage, CreativeWork, Book, BlogPosting as appropriate):
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CreativeWork",
  "name": "TITLE",
  "author": {
    "@type": "Person",
    "@id": "https://vicentegabrielflores.com/#author",
    "name": "Vicente Gabriel Flores",
    "url": "https://vicentegabrielflores.com/",
    "image": "https://vicentegabrielflores.com/assets/author/vicente-gabriel-flores-portrait.jpg"
  }
}
</script>
